plugins {
    id 'com.android.application'
}

android {
    namespace 'br.painelcafe'
    compileSdk 34

    defaultConfig {
        applicationId 'br.painelcafe'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assina com a chave de debug para gerar um APK instalável direto no celular.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
