# Atualiza toda segunda-feira a lista de produtos registrados para café (Agrofit/MAPA, dados abertos)
# usada pela consulta da aba CÁLCULO: app/src/main/assets/agrofit-cafe.json. Se mudou, grava no
# repositório e chama a publicação do site (um push feito pelo robô não dispara o pages.yml sozinho).
name: Atualizar produtos registrados (Agrofit)

on:
  schedule:
    - cron: "17 9 * * 1"   # segunda, 06:17 de Brasília
  workflow_dispatch:

permissions:
  contents: write   # gravar o agrofit-cafe.json
  actions: write    # chamar o pages.yml

jobs:
  agrofit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Separar os produtos registrados para café
        run: python scripts/agrofit_cafe.py app/src/main/assets/agrofit-cafe.json
      - name: Gravar e publicar se mudou
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # o script só regrava o arquivo quando os produtos mudaram
          if git diff --quiet -- app/src/main/assets/agrofit-cafe.json; then
            echo "Agrofit: nada mudou"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/agrofit-cafe.json
          git commit -m "Produtos registrados para café (Agrofit) atualizados"
          git pull --rebase && git push
          gh workflow run pages.yml
