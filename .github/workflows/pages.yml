# Publica a versão web (iPhone / navegador / Android) no GitHub Pages.
# Roda a cada push na main e, nos dias úteis, a cada 15 min das 05h às 22h, para atualizar o
# historico.json (fechamentos das bolsas, indicador Cepea e calibração do Conilon) e o
# intradia.json (gráfico HOJE). Execuções agendadas só republicam se algo mudou.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Horários em UTC (Brasília = UTC−3), seg a sex.
    - cron: "3-59/15 8-23 * * 1-5"  # 05:03 às 20:48, a cada 15 min (gráfico HOJE e Cepea)
    - cron: "*/15 0 * * 2-6"      # 21:00 às 21:45
    - cron: "0 1 * * 2-6"         # 22:00
    - cron: "0 12,18,23 * * 0,6"  # sáb e dom: 09h, 15h e 20h (notícias)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write    # manter o agendamento ativo (keepalive)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet websockets

      # Se falhar, o site é publicado mesmo assim e a execução fica marcada como falha
      # (o GitHub avisa por e-mail). O app continua com a última calibração publicada.
      - name: Gerar histórico, Cepea e calibração do Conilon
        id: historico
        continue-on-error: true
        run: python scripts/historico.py app/src/main/assets/config.json app/src/main/assets/historico.json

      - name: Buscar notícias do café
        id: noticias
        continue-on-error: true
        run: python scripts/noticias.py app/src/main/assets/noticias.json

      - name: Manter as notícias publicadas se a busca falhou
        if: steps.noticias.outcome == 'failure'
        run: curl -sf https://davidcaliman-maker.github.io/painel-cafe/noticias.json -o app/src/main/assets/noticias.json || true

      - name: Manter o histórico publicado se não foi possível gerar um novo
        if: steps.historico.outcome == 'failure' && hashFiles('app/src/main/assets/historico.json') == ''
        run: curl -sf https://davidcaliman-maker.github.io/painel-cafe/historico.json -o app/src/main/assets/historico.json || true

      - name: Manter o gráfico do dia publicado se não foi possível gerar um novo
        if: hashFiles('app/src/main/assets/intradia.json') == ''
        run: curl -sf https://davidcaliman-maker.github.io/painel-cafe/intradia.json -o app/src/main/assets/intradia.json || true

      # O APK mais recente também fica no próprio site: link direto, sem os redirecionamentos do
      # GitHub (alguns celulares/navegadores falham neles).
      - name: Copiar APK mais recente para o site
        continue-on-error: true
        run: curl -sfL https://github.com/davidcaliman-maker/painel-cafe/releases/latest/download/PainelAgro.apk -o app/src/main/assets/PainelAgro.apk

      # Marca a publicação com o código do commit: o app compara com versao.json e se
      # recarrega sozinho quando há tela nova.
      - name: Carimbar versão
        run: |
          V="${GITHUB_SHA::7}"
          sed -i "s/__VERSAO__/$V/" app/src/main/assets/index.html
          echo "{\"versao\": \"$V\"}" > app/src/main/assets/versao.json
          cat app/src/main/assets/versao.json

      # Push ou execução manual: publica sempre. Agendada: só se o histórico ou as notícias mudaram.
      - uses: actions/configure-pages@v5
        if: github.event_name != 'schedule' || steps.historico.outputs.mudou != 'false' || steps.noticias.outputs.mudou == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.historico.outputs.mudou != 'false' || steps.noticias.outputs.mudou == 'true'
        with:
          path: app/src/main/assets
      - id: deployment
        if: github.event_name != 'schedule' || steps.historico.outputs.mudou != 'false' || steps.noticias.outputs.mudou == 'true'
        uses: actions/deploy-pages@v4

      # O GitHub desliga agendamentos após 60 dias sem atividade no repositório; isto evita.
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1

      - name: Marcar falha se o histórico não foi gerado
        if: steps.historico.outcome == 'failure'
        run: exit 1
