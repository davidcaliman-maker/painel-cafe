# Publica a versão web (iPhone / navegador / Android) no GitHub Pages.
# Roda a cada push na main e, nos dias úteis, de hora em hora (06h–15h) e a cada 15 min
# (16h–22h, quando o Cepea publica), para atualizar o historico.json: fechamentos das bolsas,
# indicador Cepea e calibração do Conilon. Execuções agendadas só republicam se algo mudou.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Horários em UTC (Brasília = UTC−3), seg a sex.
    - cron: "5 9-18 * * 1-5"      # 06:05 às 15:05, de hora em hora
    - cron: "*/15 19-23 * * 1-5"  # 16:00 às 20:45, a cada 15 min
    - cron: "*/15 0 * * 2-6"      # 21:00 às 21:45
    - cron: "0 1 * * 2-6"         # 22:00
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write    # manter o agendamento ativo (keepalive)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet websockets

      # Se falhar, o site é publicado mesmo assim e a execução fica marcada como falha
      # (o GitHub avisa por e-mail). O app continua com a última calibração publicada.
      - name: Gerar histórico, Cepea e calibração do Conilon
        id: historico
        continue-on-error: true
        run: python scripts/historico.py app/src/main/assets/config.json app/src/main/assets/historico.json

      - name: Manter o histórico publicado se não foi possível gerar um novo
        if: steps.historico.outcome == 'failure' && hashFiles('app/src/main/assets/historico.json') == ''
        run: curl -sf https://davidcaliman-maker.github.io/painel-cafe/historico.json -o app/src/main/assets/historico.json || true

      # Marca a publicação com o código do commit: o app compara com versao.json e se
      # recarrega sozinho quando há tela nova.
      - name: Carimbar versão
        run: |
          V="${GITHUB_SHA::7}"
          sed -i "s/__VERSAO__/$V/" app/src/main/assets/index.html
          echo "{\"versao\": \"$V\"}" > app/src/main/assets/versao.json
          cat app/src/main/assets/versao.json

      # Push ou execução manual: publica sempre. Agendada: só se o histórico mudou.
      - uses: actions/configure-pages@v5
        if: github.event_name != 'schedule' || steps.historico.outputs.mudou != 'false'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.historico.outputs.mudou != 'false'
        with:
          path: app/src/main/assets
      - id: deployment
        if: github.event_name != 'schedule' || steps.historico.outputs.mudou != 'false'
        uses: actions/deploy-pages@v4

      # O GitHub desliga agendamentos após 60 dias sem atividade no repositório; isto evita.
      - uses: liskin/gh-workflow-keepalive@v1

      - name: Marcar falha se o histórico não foi gerado
        if: steps.historico.outcome == 'failure'
        run: exit 1
