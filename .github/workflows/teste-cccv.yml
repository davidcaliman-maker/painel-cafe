# Teste temporário (18/11/2026): o site do CCCV abre no GitHub e mostra o Conilon em texto?
name: Teste CCCV
on:
  push:
    branches: [claude/mobile-code-editing-mpv1ha]
    paths: [.github/workflows/teste-cccv.yml]
permissions:
  contents: read
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o cccv.html -w "HTTP %{http_code} %{size_download} bytes %{url_effective}\n" https://www.cccv.org.br/ || true
          echo "---- trechos com conil/robusta/7/8 ----"
          python3 - <<'PY'
          import re, html
          s = open("cccv.html", encoding="utf-8", errors="replace").read()
          t = html.unescape(re.sub(r"<script.*?</script>|<style.*?</style>", " ", s, flags=re.S|re.I))
          t = re.sub(r"<[^>]+>", " ", t); t = re.sub(r"\s+", " ", t)
          for m in re.finditer(r"(?i)conil|robusta|7/8|cota", t):
              print("...", t[max(0, m.start()-150): m.end()+250])
          print("---- imagens/iframes/pdf ----")
          for m in re.finditer(r'(?i)<(img|iframe)[^>]+(src|data-src)="([^"]+)"', s):
              if re.search(r"(?i)cota|conil|preco|preço|robusta", m.group(0)): print(m.group(3))
          for m in re.finditer(r'(?i)href="([^"]+\.pdf)"', s): print("pdf:", m.group(1))
          PY
