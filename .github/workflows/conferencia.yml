# Rotina da noite (22h30, dias úteis). (O acerto da estimativa passou para o pages.yml em 22/10/2026.)
# Cepea do dia: confere se o app já tem o Cepea de hoje (é com ele que o preço de amanhã começa).
#    Se o Cepea publicou e o app não pegou, publica o site de novo e confere outra vez. Se ainda
#    faltar, a execução falha e o GitHub avisa o usuário por e-mail (motivo no resumo da execução).
# (Até 01/10/2026 também comparava com o cotacaodocafe.com; o usuário pediu para retirar.)
name: Cepea do dia

on:
  schedule:
    - cron: "30 1 * * 2-6"   # 22:30 (horário de Brasília), seg a sex — depois do Cepea do dia
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # publicar o site de novo e manter o agendamento ativo (keepalive)

jobs:
  noite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet websockets

      - name: Conferir se o app tem o Cepea de hoje
        id: cepea
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: cd scripts && python cepea_do_dia.py --corrigir

      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1
        if: ${{ !cancelled() }}

      # Falha no fim = e-mail do GitHub para o usuário. O motivo está no resumo da execução.
      - name: Avisar se o app ficou sem o Cepea de hoje
        if: steps.cepea.outcome == 'failure'
        run: exit 1
