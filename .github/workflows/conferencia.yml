# Acerto da estimativa do Conilon: anota em dados/acerto.csv a estimativa AO VIVO do app
# (10h, 13h, 16h e fim do dia) contra o Cepea do dia, para avaliar a fórmula depois de algumas
# semanas. (Até 01/10/2026 também comparava com o cotacaodocafe.com; o usuário pediu para retirar.)
name: Acerto da estimativa do Conilon

on:
  schedule:
    - cron: "30 1 * * 2-6"   # 22:30 (horário de Brasília), seg a sex — depois do Cepea do dia
  workflow_dispatch:

permissions:
  contents: write  # gravar dados/acerto.csv no repositório
  actions: write   # manter o agendamento ativo (keepalive)

jobs:
  anotar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Commits feitos com o token do próprio GitHub Actions não disparam o "Publicar no GitHub Pages".
      - name: Anotar acerto da estimativa do dia
        run: |
          python scripts/acerto.py dados/acerto.csv
          if [ -n "$(git status --porcelain dados)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dados/acerto.csv
            git commit -m "Acerto da estimativa do Conilon: $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
            git push
          fi

      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1
        if: ${{ !cancelled() }}
