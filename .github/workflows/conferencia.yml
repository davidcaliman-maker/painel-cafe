# Conferência diária do Conilon: app × preço principal do cotacaodocafe.com (Cepea).
# Se houver diferença, a execução falha e o GitHub avisa por e-mail. Se estiver tudo certo,
# não acontece nada.
# Também anota em dados/acerto.csv o acerto da estimativa AO VIVO (10h, 13h, 16h e fim do dia)
# contra o Cepea do dia, para avaliar a fórmula depois de algumas semanas.
name: Conferência do Conilon

on:
  schedule:
    - cron: "30 1 * * 2-6"   # 22:30 (horário de Brasília), seg a sex — depois do Cepea do dia
  workflow_dispatch:

permissions:
  contents: write  # gravar dados/acerto.csv no repositório
  actions: write   # manter o agendamento ativo (keepalive)

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Commits feitos com o token do próprio GitHub Actions não disparam o "Publicar no GitHub Pages".
      - name: Anotar acerto da estimativa do dia
        continue-on-error: true
        run: |
          python scripts/acerto.py dados/acerto.csv
          if [ -n "$(git status --porcelain dados)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dados/acerto.csv
            git commit -m "Acerto da estimativa do Conilon: $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
            git push
          fi

      - name: Comparar app e cotacaodocafe.com
        run: cd scripts && python conferencia.py
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1
        if: ${{ !cancelled() }}
